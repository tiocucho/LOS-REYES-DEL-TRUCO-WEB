name: Extraer ZIP del proyecto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir -p /tmp/proyecto
          unzip -o LOS-REYES-DEL-TRUCO-WEB-ACTUALIZADO.zip -d /tmp/proyecto
          cp -a /tmp/proyecto/los-reyes-del-truco/. .
          rm -f LOS-REYES-DEL-TRUCO-WEB-ACTUALIZADO.zip

      - name: Guardar archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extraer proyecto LOS REYES DEL TRUCO"
          git push
